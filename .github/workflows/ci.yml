name: ci

on:
  pull_request:
  push:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Compile
        run: python -m compileall -q src

      - name: Test
        run: pytest -q

      - name: MCP runtime integration
        run: pytest -q tests/test_mcp_server.py

      - name: Worker JS syntax and contracts
        run: |
          node --check infra/vehicle_knowledge/worker.js
          node tests/fixtures/eng007_worker_execution.mjs
          node tests/fixtures/rd021_media_worker.mjs

      - name: Core import
        run: python -c "from openai import OpenAI; from global_hybrid_v2.application import create_application; from global_hybrid_v2.adapters.mcp_server import mcp; print('import-ok')"

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rd021_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rd021_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      RD021_REQUIRE_POSTGRES: "1"
      RD021_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/rd021_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Target guard and migration qualification
        run: python -m tests.rd021_postgres_qualification
      - name: Real PostgreSQL contract tests
        run: pytest -q tests/test_rd021_postgres_integration.py tests/test_rd021_consumer_composition.py
