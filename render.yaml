services:
  - type: web
    name: global-hybrid-mcp-v2
    runtime: docker
    plan: free
    region: singapore
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: GLOBAL_MODEL
        value: gpt-5.6-sol
      - key: GLOBAL_AUTHORITY_REGISTRY
        value: /app/authority/current/registry.json
      - key: GLOBAL_AUTHORITY_TRUSTED_KEY_ID
        sync: false
      - key: GLOBAL_AUTHORITY_TRUSTED_PUBLIC_KEY
        sync: false
      - key: GLOBAL_RESEARCH_PROVIDER
        value: openai_web
      - key: GLOBAL_RESEARCH_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GLOBAL_LIVE_EXECUTION
        value: "false"
