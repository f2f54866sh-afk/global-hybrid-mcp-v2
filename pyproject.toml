[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "global-hybrid-v2"
version = "0.1.0"
description = "Deterministic control-plane and MCP adapter for GLOBAL Hybrid"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "starlette>=0.50,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ai = ["openai>=2.25,<3"]
observability = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "pyright>=1.1.390",
]

[tool.hatch.build.targets.wheel]
packages = ["src/global_hybrid_v2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
