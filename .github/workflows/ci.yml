name: ci

on:
  pull_request:
  push:

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Compile
        run: python -m compileall -q src

      - name: Test
        run: pytest -q

      - name: MCP runtime integration
        run: pytest -q tests/test_mcp_server.py

      - name: Core import
        run: python -c "from openai import OpenAI; from global_hybrid_v2.application import create_application; from global_hybrid_v2.adapters.mcp_server import mcp; print('import-ok')"
