name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Compile
        run: python -m compileall -q src

      - name: Test
        run: pytest -q

      - name: Core import
        run: python -c "from global_hybrid_v2.runtime.dispatcher import Dispatcher; print('import-ok')"
